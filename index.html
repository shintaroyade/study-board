<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1222">
<title>英語勉強会ボード</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Unbounded:wght@500;700;800&display=swap">
<style>
/* Layout: one-column mobile app — sticky header, tab views, fixed bottom tab bar, bottom sheets for detail/edit. Dark-first. */
:root{
  --bg:#0B1222; --surface:#121B30; --surface2:#1A2540; --line:#26324F;
  --fg:#E8EEF9; --muted:#8C9AB8;
  --lime:#C6F432; --lime-text:#C6F432; --ink:#0B1222;
  --cyan:#22D3EE; --orange:#FF8A3D; --violet:#A78BFA;
  --gold:#F5C542; --danger:#FF6B6B;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --display:"Unbounded","Noto Sans JP",system-ui,sans-serif;
  --body:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --r:18px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#EEF2F8; --surface:#FFFFFF; --surface2:#E4EAF4; --line:#D2DAE8;
    --fg:#0F172A; --muted:#5B6782; --lime:#C6F432; --lime-text:#4A7300; --ink:#0B1222;
    --cyan:#0891B2; --orange:#E2620E; --violet:#7C5CE0; --gold:#B8860B; --danger:#D93F3F;
    --shadow:0 8px 24px rgba(15,23,42,.10); color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#EEF2F8; --surface:#FFFFFF; --surface2:#E4EAF4; --line:#D2DAE8;
  --fg:#0F172A; --muted:#5B6782; --lime:#C6F432; --lime-text:#4A7300; --ink:#0B1222;
  --cyan:#0891B2; --orange:#E2620E; --violet:#7C5CE0; --gold:#B8860B; --danger:#D93F3F;
  --shadow:0 8px 24px rgba(15,23,42,.10); color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px)}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.brand{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.logo{width:36px;height:36px;border-radius:11px;background:#0B1222;border:1px solid var(--line);display:grid;place-items:center;flex:none}
.logo svg{width:30px;height:30px}
.brand-name{font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{display:block;font-size:11px;color:var(--muted);font-family:var(--body);font-weight:500;letter-spacing:.06em}
.icon-btn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px}
.av{border-radius:50%;display:inline-grid;place-items:center;font-weight:700;color:#0B1222;flex:none;font-size:13px;width:30px;height:30px}
.av.lg{width:46px;height:46px;font-size:18px}

main{padding-block:16px 120px}
.view{display:flex;flex-direction:column;gap:16px}
.banner{padding:10px 14px;border-radius:12px;background:var(--surface2);color:var(--muted);font-size:13px}
.banner.warn{border:1px solid var(--orange);color:var(--fg)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:6px 2px 0}
.sec-h h2{font-family:var(--display);font-size:15px;font-weight:700;margin:0;letter-spacing:.02em}
.sec-h .link{background:none;border:0;color:var(--lime-text);font-weight:700;font-size:13px;padding:6px 0}
.muted{color:var(--muted)}
.small{font-size:13px}

/* hero next */
.hero{position:relative;overflow:hidden;padding:20px;border-radius:22px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--tc,var(--cyan)) 30%,transparent),transparent 70%);pointer-events:none}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--muted)}
.hero h3{font-family:var(--display);font-size:22px;line-height:1.3;margin:6px 0 4px;text-wrap:balance;position:relative}
.countdown{display:flex;gap:8px;margin:14px 0;position:relative}
.cd{background:var(--surface2);border-radius:12px;padding:8px 12px;min-width:64px;text-align:center}
.cd b{display:block;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums;line-height:1.2}
.cd span{font-size:11px;color:var(--muted)}
.meta{display:grid;gap:6px;font-size:14px;position:relative}
.meta div{display:flex;gap:8px;align-items:flex-start;min-width:0}
.meta .k{color:var(--muted);flex:none;width:3.2em;font-size:12px;padding-top:2px}
.meta a{color:var(--lime-text);word-break:break-all}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--tc) 18%,transparent);color:var(--tc);position:relative}
.tag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--tc)}
.t-grammar{--tc:var(--cyan)} .t-lesson{--tc:var(--orange)} .t-other{--tc:var(--violet)}

.rsvp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;position:relative}
.rsvp button{min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface2);font-weight:700;font-size:14px}
.rsvp button.on.yes{background:var(--lime);color:var(--ink);border-color:var(--lime)}
.rsvp button.on.no{background:var(--danger);color:#fff;border-color:var(--danger)}
.rsvp button.on.maybe{background:var(--gold);color:#1a1300;border-color:var(--gold)}
.goers{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:13px;color:var(--muted);flex-wrap:wrap;position:relative}
.stack{display:flex}
.stack .av{margin-left:-8px;border:2px solid var(--surface);width:30px;height:30px}
.stack .av:first-child{margin-left:0}

.btn{min-height:48px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface2);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--lime);color:var(--ink);border-color:var(--lime)}
.btn.line{background:#06C755;border-color:#06C755;color:#fff}
.btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn.block{width:100%}
.btn svg{width:18px;height:18px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}

/* list items */
.list{display:flex;flex-direction:column;gap:8px}
.ev{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.ev .date{flex:none;width:52px;text-align:center;border-radius:10px;padding:6px 0;background:color-mix(in srgb,var(--tc) 16%,transparent)}
.ev .date b{display:block;font-family:var(--display);font-size:18px;line-height:1.1;color:var(--tc)}
.ev .date span{font-size:11px;color:var(--muted)}
.ev .body{flex:1;min-width:0}
.ev .title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.past{opacity:.7}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.stat{display:flex;align-items:center;gap:14px}
.flame{font-family:var(--display);font-size:34px;font-weight:800;color:var(--orange);font-variant-numeric:tabular-nums;line-height:1}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--lime));border-radius:99px;transition:width .6s ease}

/* calendar */
.cal-head{display:flex;align-items:center;gap:8px}
.cal-head h2{flex:1;font-family:var(--display);font-size:20px;margin:0;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;background:var(--surface2);border-radius:12px;padding:3px;border:1px solid var(--line)}
.seg button{border:0;background:none;padding:8px 14px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted);min-height:36px}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{font-size:11px;text-align:center;color:var(--muted);font-weight:700;padding:4px 0}
.dow.sun{color:var(--danger)} .dow.sat{color:var(--cyan)}
.day{min-height:68px;border-radius:12px;background:var(--surface);border:1px solid var(--line);padding:6px 5px;display:flex;flex-direction:column;gap:3px;text-align:left;min-width:0}
.day.out{opacity:.35}
.day .n{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.day.today{border-color:var(--lime);box-shadow:inset 0 0 0 1px var(--lime)}
.day.today .n{background:var(--lime);color:var(--ink);border-radius:99px;padding:0 6px;align-self:flex-start}
.chip{display:block;font-size:10px;line-height:1.4;padding:1px 4px;border-radius:5px;background:color-mix(in srgb,var(--tc) 22%,transparent);color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--tc)}
@media (max-width:480px){.chip{font-size:0;height:6px;padding:0;border-left:0;background:var(--tc)}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--tc)}
.weekday{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.weekday:last-child{border-bottom:0}
.weekday .wd{width:48px;flex:none;text-align:center}
.weekday .wd b{display:block;font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.weekday .wd span{font-size:11px;color:var(--muted)}
.weekday.today .wd b{color:var(--lime-text)}
.weekday .items{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.add-day{border:1px dashed var(--line);background:none;border-radius:12px;padding:8px;color:var(--muted);font-size:13px;text-align:left}

/* ranking */
.rank{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.rank.me{border-color:var(--lime)}
.rank .pos{width:34px;text-align:center;font-family:var(--display);font-size:18px;font-weight:800;flex:none;font-variant-numeric:tabular-nums}
.rank .who{flex:1;min-width:0}
.rank .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .cnt{font-family:var(--display);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.rank .cnt small{font-family:var(--body);font-size:11px;color:var(--muted);margin-left:2px}
.streak{font-size:12px;color:var(--orange);font-weight:700}
.nudge{font-size:12px;color:var(--lime-text);font-weight:700}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:8px}
.pod{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 6px 12px;min-width:0}
.pod .medal{font-size:28px;line-height:1}
.pod b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:6px}
.pod .cnt{font-family:var(--display);font-size:22px;font-weight:800}
.pod.p1{padding-top:22px;border-color:var(--gold)}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--fg);border:1px solid var(--line)}

/* grammar */
.unit{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.unit .no{width:28px;flex:none;font-family:var(--display);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.unit .nm{flex:1;min-width:0}
.unit .nm b{display:block}
.unit .evs{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.unit .evs button{font-size:11px;border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:2px 8px}
.st{min-width:84px;min-height:38px;border-radius:99px;font-size:12px;font-weight:700;border:1px solid var(--line);background:var(--surface2);color:var(--muted)}
.st.doing{background:color-mix(in srgb,var(--cyan) 20%,transparent);color:var(--cyan);border-color:var(--cyan)}
.st.done{background:var(--lime);color:var(--ink);border-color:var(--lime)}
.unit.done .nm b{opacity:.75}
.big-pct{font-family:var(--display);font-size:44px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}

/* members */
.mem{display:flex;gap:14px;align-items:flex-start;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.mem .info{flex:1;min-width:0}
.mem .info b{font-size:16px}
.mem .skill{display:inline-block;font-size:12px;font-weight:700;color:var(--orange);margin-top:2px}
.mem .nums{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.mem .nums b{font-family:var(--display);font-size:15px;color:var(--fg);font-weight:700;margin-right:2px}
.tbd{display:flex;gap:8px;flex-wrap:wrap}
.tbd span{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:99px;background:var(--surface2);font-size:13px;font-weight:700}
.tbd .av{width:24px;height:24px;font-size:11px}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;background:none;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);min-height:58px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--lime-text)}
nav.tabs button.on svg{filter:drop-shadow(0 0 6px color-mix(in srgb,var(--lime) 60%,transparent))}
.fab{position:fixed;z-index:24;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:18px;border:0;background:var(--lime);color:var(--ink);display:grid;place-items:center;box-shadow:0 10px 24px color-mix(in srgb,var(--lime) 35%,transparent)}
.fab svg{width:26px;height:26px}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(3,8,20,.55);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s}
.scrim.open{opacity:1}
.sheet{width:100%;max-width:640px;max-height:88vh;overflow:auto;background:var(--surface);border-radius:24px 24px 0 0;border:1px solid var(--line);padding:10px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));transform:translateY(24px);transition:transform .22s ease}
.scrim.open .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h3{font-family:var(--display);font-size:19px;margin:0 0 4px;text-wrap:balance}
.sheet .stackv{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.field input,.field select,.field textarea{min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);padding:10px 12px;width:100%;min-width:0}
.field textarea{min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px}
@media (max-width:440px){.three{grid-template-columns:1fr 1fr}.three .field:first-child{grid-column:1/-1}}
.typepick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.typepick button{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-weight:700;font-size:13px}
.typepick button.on{background:color-mix(in srgb,var(--tc) 22%,transparent);border-color:var(--tc);color:var(--fg)}
.inline{display:flex;gap:8px}
.inline input{flex:1}
.inline .btn{min-height:46px;padding:0 12px;font-size:13px;flex:none}
.att{display:flex;gap:8px;flex-wrap:wrap}
.att button{display:inline-flex;align-items:center;gap:6px;padding:4px 12px 4px 4px;border-radius:99px;border:1px solid var(--line);background:var(--surface2);font-size:13px;font-weight:700;min-height:38px}
.att button .av{width:28px;height:28px;font-size:12px}
.att button.on{background:var(--lime);color:var(--ink);border-color:var(--lime)}
.copybox{width:100%;min-height:150px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);padding:12px;font-size:13px}
.divider{height:1px;background:var(--line);margin:4px 0}
.rsvp-list{display:grid;gap:4px;font-size:13px}

.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);z-index:60;background:var(--fg);color:var(--bg);font-weight:700;font-size:14px;padding:10px 18px;border-radius:99px;opacity:0;transition:.25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
canvas#fx{position:fixed;inset:0;z-index:70;pointer-events:none;width:100%;height:100%}
.empty{text-align:center;padding:26px 12px;color:var(--muted);font-size:14px;border:1px dashed var(--line);border-radius:16px}
.reg{border:1px solid var(--lime);background:color-mix(in srgb,var(--lime) 8%,var(--surface))}
.reg h3{font-family:var(--display);font-size:18px;margin:0 0 4px}
.greet h2{font-family:var(--display);font-size:24px;margin:2px 0 0;text-wrap:balance}
.greet p{margin:4px 0 0}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mini-stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 8px;text-align:center;min-width:0}
.card .mini-stat{background:var(--surface2)}
.mini-stat b{display:block;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums;line-height:1.25;white-space:nowrap}
.mini-stat span{font-size:11px;color:var(--muted)}
.lock{font-size:12px;color:var(--muted);font-weight:700}
.self{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:11px;color:var(--muted);font-weight:700}
.self button{width:36px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);font-size:15px;font-weight:700;color:var(--muted)}
.self button.on[data-v="◎"]{background:var(--lime);border-color:var(--lime);color:var(--ink)}
.self button.on[data-v="○"]{background:var(--cyan);border-color:var(--cyan);color:var(--ink)}
.self button.on[data-v="△"]{background:var(--orange);border-color:var(--orange);color:var(--ink)}
.link-btn{background:none;border:0;color:var(--lime-text);font-weight:700;font-size:13px;padding:8px 0;align-self:center}
.qa{display:flex;flex-direction:column;gap:6px}
.rsvp.mini{margin-top:0}
.rsvp.mini button{min-height:40px;font-size:13px}
.ulist{display:flex;gap:6px;flex-wrap:wrap}
.memo-card{display:flex;flex-direction:column;gap:14px}
/* ---- splash (loading) : always the dark brand look ---- */
#splash{position:fixed;inset:0;z-index:100;background:#0B1222;display:grid;place-items:center;transition:opacity .5s ease,visibility .5s}
#splash.out{opacity:0;visibility:hidden}
.sp-in{display:flex;flex-direction:column;align-items:center;transition:transform .5s ease}
#splash.out .sp-in{transform:scale(1.07)}
.sp-mark{width:136px;height:136px;overflow:visible}
.sp-mark *{transform-box:view-box}
.sp-glow{fill:#C6F432;opacity:0;filter:blur(13px);transform-origin:60px 60px;animation:spGlow 1.8s ease-in-out .95s infinite}
.sp-bubble{fill:none;stroke:#22D3EE;stroke-width:8;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:spDraw .8s cubic-bezier(.65,0,.25,1) .1s forwards}
.sp-flame{transform-origin:60px 74px;transform:scale(0)}
.sp-flame.f-outer{fill:#C6F432;animation:spIgnite .5s cubic-bezier(.3,1.7,.5,1) .75s forwards,spFlicker 1.1s ease-in-out 1.25s infinite}
.sp-flame.f-core{fill:#F3FFD6;animation:spIgnite .45s cubic-bezier(.3,1.7,.5,1) .9s forwards,spFlicker2 .9s ease-in-out 1.35s infinite}
.sp-ember{fill:#C6F432;opacity:0;animation:spEmber 1.6s ease-out infinite}
.sp-ember.e1{--dx:-6px;animation-delay:1.3s}
.sp-ember.e2{--dx:5px;animation-delay:1.85s}
.sp-ember.e3{--dx:-1px;animation-delay:2.4s}
.sp-name{margin-top:18px;font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.02em;color:#E8EEF9;opacity:0;transform:translateY(8px);animation:spUp .55s ease 1.05s forwards}
.sp-sub{margin-top:4px;font-size:10px;font-weight:700;letter-spacing:.22em;color:#8C9AB8;opacity:0;transform:translateY(6px);animation:spUp .55s ease 1.2s forwards}
.sp-wait{margin-top:22px;font-size:12px;color:#8C9AB8;opacity:0;transition:opacity .4s}
.sp-wait.on{opacity:1}
@keyframes spDraw{to{stroke-dashoffset:0}}
@keyframes spIgnite{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes spFlicker{0%,100%{transform:scale(1,1) skewX(0)}30%{transform:scale(.95,1.07) skewX(-2.5deg)}65%{transform:scale(1.04,.97) skewX(2deg)}}
@keyframes spFlicker2{0%,100%{transform:scale(1,1)}50%{transform:scale(.9,1.12)}}
@keyframes spGlow{0%,100%{opacity:.16;transform:scale(.88)}50%{opacity:.4;transform:scale(1.12)}}
@keyframes spEmber{0%{opacity:0;transform:translate(0,0)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-30px)}}
@keyframes spUp{to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}
  .sp-bubble{stroke-dashoffset:0}.sp-flame{transform:none}.sp-name,.sp-sub{opacity:1;transform:none}.sp-glow{opacity:.25}}
</style>
</head>

<script>
(() => {
/* ---------- constants ---------- */
const UNITS = [
  ["bunkei","文型","5文型・SVOC"],["hinshi","品詞","名詞・動詞・形容詞・副詞"],["jisei","時制","現在・過去・未来・進行形"],
  ["kanryo","完了形","現在完了・過去完了"],["jodoushi","助動詞","can / must / should …"],["ukemi","受動態","be + 過去分詞"],
  ["futeishi","不定詞","to + 動詞の原形"],["doumeishi","動名詞","-ing の名詞的用法"],["bunshi","分詞","現在分詞・過去分詞・分詞構文"],
  ["hikaku","比較","原級・比較級・最上級"],["kankei","関係詞","関係代名詞・関係副詞"],["katei","仮定法","if節・I wish"],
  ["wahou","話法","直接話法・間接話法"],["meishi","名詞・冠詞","可算/不可算・a / the"],["zenchi","前置詞","in / on / at …"],
  ["setsuzoku","接続詞","等位・従属接続詞"],["tokushu","特殊構文","倒置・強調・省略"]
];
const UNIT_MAP = Object.fromEntries(UNITS.map(u=>[u[0],u]));
const TYPES = {grammar:"英文法",lesson:"メンバー授業",other:"その他"};
const WD = ["日","月","火","水","木","金","土"];
const AV_COLORS = ["#C6F432","#22D3EE","#FF8A3D","#A78BFA","#F5C542","#5EEAD4","#F472B6","#93C5FD"];

/* ---------- state ---------- */
const S = {members:{}, events:[], rsvps:[], progress:{}, appName:"", ready:{}, canWrite:false, auth:null, authReady:false, priv:{}};
let draft=null;
let db=null, auth=null, myId=null, unsubs=[];
let tab="home", calMode="month", calCursor=new Date(), rankMode="all";
const $ = s=>document.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}, del(k){try{localStorage.removeItem(k)}catch(e){}}};

/* ---------- dates ---------- */
const pad = n=>String(n).padStart(2,"0");
const ymd = d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd = s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const todayStr = ()=>ymd(new Date());
const md = s=>{const d=pd(s);return `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`};
const evStart = e=>{const d=pd(e.date);const [h,m]=(e.start||"00:00").split(":").map(Number);d.setHours(h,m);return d};
const evEnd = e=>{const d=pd(e.date);const [h,m]=(e.end||e.start||"23:59").split(":").map(Number);d.setHours(h,m);return d};
const timeRange = e=>e.start?`${e.start}${e.end?"〜"+e.end:""}`:"時間未定";
const mapUrl = place=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(place);

/* ---------- helpers ---------- */
function hashColor(id){let h=0;for(const c of String(id))h=(h*31+c.charCodeAt(0))>>>0;return AV_COLORS[h%AV_COLORS.length]}
function avatar(id,cls=""){const m=S.members[id];const n=m?.name||"?";return `<span class="av ${cls}" style="background:${hashColor(id)}" aria-hidden="true">${esc([...n.replace(/[(（].*$/,"").trim()||n][0]||"?")}</span>`}
const mname = id=>S.members[id]?.name||"(未登録)";
const hostOf = e=>e.hostId&&S.members[e.hostId]?S.members[e.hostId].name:"";
const sortedEvents = ()=>[...S.events].sort((a,b)=>(a.date+(a.start||"")).localeCompare(b.date+(b.start||"")));
const memberIds = ()=>Object.keys(S.members).sort((a,b)=>(S.members[a].joinedAt||0)-(S.members[b].joinedAt||0));
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove("on"),2200)}
const newId = ()=>"m"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ---------- stats ---------- */
function stats(){
  const t=todayStr(), month=t.slice(0,7);
  const recorded = sortedEvents().filter(e=>e.date<=t && Array.isArray(e.attended) && e.attended.length);
  const out={};
  for(const id of Object.keys(S.members)){
    const att = recorded.filter(e=>e.attended.includes(id));
    let streak=0; for(let i=recorded.length-1;i>=0;i--){ if(recorded[i].attended.includes(id)) streak++; else break; }
    const taught = sortedEvents().filter(e=>e.type==="lesson"&&e.hostId===id);
    const taughtDone = taught.filter(e=>e.date<=t);
    const count=att.length;
    const badges=[];
    if(count>=1)badges.push("🎉 初参加");
    if(count>=5)badges.push("⭐ 5回");
    if(count>=10)badges.push("🏅 10回");
    if(count>=30)badges.push("👑 30回");
    if(streak>=3)badges.push("🔥 3連続");
    if(streak>=5)badges.push("💥 5連続");
    if(taughtDone.length>=1)badges.push("🎤 授業デビュー");
    out[id]={count, month:att.filter(e=>e.date.startsWith(month)).length, streak, taught, taughtDone, badges};
  }
  return out;
}

/* ---------- copy text ---------- */
function lineText(e){
  const L=[`📅 ${md(e.date)} ${timeRange(e)}`];
  if(e.place) L.push(`📍 ${e.place}${e.map?`\n${e.map}`:""}`);
  const content = e.type==="grammar"&&e.unit ? `${UNIT_MAP[e.unit]?.[1]||""}${e.title&&e.title!==UNIT_MAP[e.unit]?.[1]?`(${e.title})`:""}` : e.title;
  L.push(`📖 ${TYPES[e.type]||""}:${content}`);
  if(hostOf(e)) L.push(`🙋 担当:${hostOf(e)}`);
  if(e.memo) L.push(`📝 ${e.memo}`);
  if(e.link) L.push(`📎 ${e.link}`);
  L.push("参加できる人は返信してね!");
  return L.join("\n");
}
function weekRange(){const d=new Date();d.setHours(0,0,0,0);const mon=new Date(d);mon.setDate(d.getDate()-((d.getDay()+6)%7));const sun=new Date(mon);sun.setDate(mon.getDate()+6);return [ymd(mon),ymd(sun)]}
function weekText(){
  const [a,b]=weekRange();const evs=sortedEvents().filter(e=>e.date>=a&&e.date<=b);
  if(!evs.length) return null;
  const head=`【今週の${S.appName||"勉強会"}】${md(a)}〜${md(b)}`;
  return [head,...evs.map(e=>{
    const c = e.type==="grammar"&&e.unit?UNIT_MAP[e.unit]?.[1]:e.title;
    return `\n▶ ${md(e.date)} ${timeRange(e)}\n  ${TYPES[e.type]}:${c}${hostOf(e)?` / 担当 ${hostOf(e)}`:""}${e.place?`\n  📍 ${e.place}`:""}${e.map?`\n  ${e.map}`:""}`;
  }),"\n参加できる人は返信してね!"].join("\n");
}
async function copy(text){
  try{ await navigator.clipboard.writeText(text); toast("コピーしました。LINEに貼り付けてね"); }
  catch(err){
    openSheet(`<h3>コピー用テキスト</h3><p class="muted small">自動コピーできなかったので、下の文を長押しして全部コピーしてください。</p><textarea class="copybox" id="cpbox" readonly>${esc(text)}</textarea><button class="btn block" data-close>閉じる</button>`);
    const t=$("#cpbox"); t.focus(); t.select();
  }
}

/* ---------- render: home ---------- */
function eventRow(e){
  const d=pd(e.date); const past = evEnd(e)<new Date();
  const sub=[timeRange(e), e.place, hostOf(e)?`担当 ${hostOf(e)}`:""].filter(Boolean).join(" · ");
  const title = e.type==="grammar"&&e.unit ? `${UNIT_MAP[e.unit]?.[1]}${e.title&&e.title!==UNIT_MAP[e.unit]?.[1]?" — "+e.title:""}` : e.title;
  return `<button class="ev t-${e.type}${past?" past":""}" data-ev="${esc(e.id)}"><span class="date"><b>${d.getDate()}</b><span>${d.getMonth()+1}月 ${WD[d.getDay()]}</span></span><span class="body"><span class="title">${esc(title||"(タイトルなし)")}</span><span class="sub">${esc(sub)}</span></span><span class="tag t-${e.type}" style="flex:none">${TYPES[e.type]}</span></button>`;
}
function rsvpOf(eid){const r={};for(const x of S.rsvps)if(x.eventId===eid)r[x.uid]=x.status;return r}
function rsvpBlock(e){
  const r=rsvpOf(e.id); const mine=myId?r[myId]:null;
  const yes=Object.keys(r).filter(k=>r[k]==="yes"&&S.members[k]);
  const maybe=Object.keys(r).filter(k=>r[k]==="maybe"&&S.members[k]);
  return `<div class="rsvp" role="group" aria-label="出欠">
    ${[["yes","参加"],["maybe","未定"],["no","不参加"]].map(([k,l])=>`<button class="${k}${mine===k?" on":""}" data-rsvp="${k}" data-eid="${esc(e.id)}" ${S.canWrite?"":"disabled"}>${l}</button>`).join("")}
  </div>
  <div class="goers">${yes.length?`<span class="stack">${yes.slice(0,7).map(id=>avatar(id)).join("")}</span><span>参加予定 <b style="color:var(--fg)">${yes.length}人</b>${maybe.length?` · 未定 ${maybe.length}人`:""}</span>`:`<span>まだ参加表明はありません${maybe.length?` · 未定 ${maybe.length}人`:""}</span>`}</div>`;
}
function heroHtml(next, live){
  const now=new Date(); const ms=evStart(next)-now;
  const c=next.type==="grammar"?"cyan":next.type==="lesson"?"orange":"violet";
  const ttl=next.type==="grammar"&&next.unit?UNIT_MAP[next.unit]?.[1]+(next.title&&next.title!==UNIT_MAP[next.unit]?.[1]?" — "+next.title:""):next.title;
  return `<article class="hero t-${next.type}" style="--tc:var(--${c})">
    <div class="row" style="justify-content:space-between;align-items:center;position:relative"><span class="eyebrow">NEXT SESSION</span><span class="tag t-${next.type}">${TYPES[next.type]}</span></div>
    <h3>${esc(ttl)}</h3>
    <div class="countdown" id="cd" data-start="${evStart(next).getTime()}" data-end="${evEnd(next).getTime()}">${cdHtml(ms, evEnd(next)-now)}</div>
    <div class="meta">
      <div><span class="k">日時</span><span>${md(next.date)} ${esc(timeRange(next))}</span></div>
      ${next.place?`<div><span class="k">場所</span><span>${esc(next.place)}${next.map?` · <a href="${esc(next.map)}" target="_blank" rel="noopener">地図を開く</a>`:""}</span></div>`:""}
      ${hostOf(next)?`<div><span class="k">担当</span><span>${esc(hostOf(next))}</span></div>`:""}
      ${next.memo?`<div><span class="k">メモ</span><span>${esc(next.memo)}</span></div>`:""}
    </div>
    ${live?rsvpBlock(next):`<p class="small muted" style="margin:14px 0 0;position:relative">出欠の返事はログインすると押せます。</p>`}
    <div class="row" style="margin-top:14px;position:relative">
      <button class="btn line" data-copy="${esc(next.id)}">${lineIcon()}LINE用にコピー</button>
      <button class="btn" data-ev="${esc(next.id)}">詳細</button>
    </div>
  </article>`;
}
function myRsvps(){const r={};for(const x of S.rsvps)if(x.uid===myId)r[x.eventId]=x.status;return r}
const GREET=["今日も一歩ずつ。","続けた人が一番伸びる。","アウトプットしたぶんだけ身につく。","小さな積み重ねが大きな差になる。"];
function renderHome(){
  const now=new Date();
  const upcoming=sortedEvents().filter(e=>evEnd(e)>=now); const next=upcoming[0];
  const [a,b]=weekRange(); const wk=sortedEvents().filter(e=>e.date>=a&&e.date<=b);

/* ---------- render: calendar ---------- */
function renderCal(){
  const c=new Date(calCursor); const t=todayStr();
  const byDate={}; for(const e of sortedEvents())(byDate[e.date]=byDate[e.date]||[]).push(e);
  let title, body;
  if(calMode==="month"){
    title=`${c.getFullYear()}.${pad(c.getMonth()+1)}`;
    const first=new Date(c.getFullYear(),c.getMonth(),1); const start=new Date(first); start.setDate(1-first.getDay());
    const last=new Date(c.getFullYear(),c.getMonth()+1,0); const cells=Math.ceil((first.getDay()+last.getDate())/7)*7;
    body=`<div class="month">${WD.map((w,i)=>`<div class="dow${i===0?" sun":i===6?" sat":""}">${w}</div>`).join("")}`;
    for(let i=0;i<cells;i++){

      body+=`<button class="day${d.getMonth()!==c.getMonth()?" out":""}${s===t?" today":""}" data-day="${s}" aria-label="${d.getMonth()+1}月${d.getDate()}日 予定${evs.length}件"><span class="n">${d.getDate()}</span>${evs.slice(0,3).map(e=>`<span class="chip t-${e.type}">${esc(e.type==="grammar"&&e.unit?UNIT_MAP[e.unit]?.[1]:e.title)}</span>`).join("")}</button>`;
    }
    body+=`</div>`;
  } else {
    const mon=new Date(c); mon.setDate(c.getDate()-((c.getDay()+6)%7));
    const sun=new Date(mon); sun.setDate(mon.getDate()+6);
    title=`${mon.getMonth()+1}/${mon.getDate()}–${sun.getMonth()+1}/${sun.getDate()}`;
    body=`<div class="card" style="padding:4px 14px">`;
    for(let i=0;i<7;i++){
      const d=new Date(mon); d.setDate(mon.getDate()+i); const s=ymd(d); const evs=byDate[s]||[];
      body+=`<div class="weekday${s===t?" today":""}"><div class="wd"><b>${d.getDate()}</b><span>${WD[d.getDay()]}曜</span></div><div class="items">${evs.map(eventRow).join("")}${evs.length?"":`<button class="add-day" data-new="${s}">+ この日に予定を追加</button>`}</div></div>`;
    }

  }
  $("#v-cal").innerHTML=`
    <div class="cal-head"><button class="icon-btn" data-cal="-1" aria-label="前へ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button><h2>${title}</h2><button class="btn" style="min-height:42px;padding:0 12px" data-cal="0">今日</button><button class="icon-btn" data-cal="1" aria-label="次へ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button></div>

}

async function setRsvp(eid,status){
  if(!S.auth){authSheet("login");return}
  if(!S.members[myId]){toast("先にプロフィールを登録してください");profileSheet(true);return}
  const docId=`${eid}__${myId}`; const cur=S.rsvps.find(r=>r.id===docId);
  try{
    if(cur&&cur.status===status) await db.doc("rsvps/"+docId).delete();
    else await db.doc("rsvps/"+docId).set({eventId:eid,uid:myId,status,sample:false});
  }catch(err){toast("送信できませんでした")}
}
const busy=new Set();
async function toggleAtt(eid,mid){
  const key="att:"+eid; if(busy.has(key))return; busy.add(key);
  const e=S.events.find(x=>x.id===eid); const before=stats()[mid];
  const set=new Set(e.attended||[]); set.has(mid)?set.delete(mid):set.add(mid);
  try{
    await db.doc("events/"+eid).update({attended:[...set]});
    const after=stats()[mid];
    if(after&&before&&(after.badges.length>before.badges.length||after.streak>before.streak)){
      confetti(); toast(after.badges.length>before.badges.length?`${mname(mid)}さんが「${after.badges.at(-1)}」を獲得!`:`${mname(mid)}さん 🔥${after.streak}連続!`);
    }
  }catch(err){toast("記録できませんでした")}
  busy.delete(key);
}
async function setUnit(k,status){
  const statuses={...S.progress,[k]:status};
  await db.doc("grammar/progress").set({statuses,sample:!!S.progressSample});
}

document.addEventListener("click",async ev=>{
  const t=ev.target.closest("button,[data-ev]"); if(!t)return;
  const d=t.dataset;
  if(d.tab) return setTab(d.tab);
  if(d.tabGo) return setTab(d.tabGo);
  if(d.ev && !d.copy) return eventSheet(d.ev);
  if(d.copy){const e=S.events.find(x=>x.id===d.copy); if(e) copy(lineText(e)); return}
  if(d.rsvp) return setRsvp(d.eid,d.rsvp);
  if(d.att){const sh=t.closest(".stackv");const eid=sh&&S.events.find(e=>sh.querySelector(`[data-copy="${CSS.escape(e.id)}"]`))?.id; if(eid) toggleAtt(eid,d.att); return}
  if(d.edit) return editSheet(d.edit);
  if(d.new) return editSheet(null,d.new);
  if(d.day) return daySheet(d.day);
  if(d.cal!==undefined){const n=Number(d.cal); if(n===0)calCursor=new Date(); else if(calMode==="month"){calCursor=new Date(calCursor.getFullYear(),calCursor.getMonth()+n,1)} else {calCursor=new Date(calCursor);calCursor.setDate(calCursor.getDate()+7*n)} return renderCal()}
  if(d.calmode){calMode=d.calmode;ls.set("calMode",calMode);return renderCal()}
  if(d.rank){rankMode=d.rank;return renderRank()}
  if(d.unit){const cur=S.progress[d.unit]||"todo";const nx={todo:"doing",doing:"done",done:"todo"}[cur];t.disabled=true;try{await setUnit(d.unit,nx);if(nx==="done"){confetti();toast(`${UNIT_MAP[d.unit][1]} 完了!`)}}catch(e){toast("変更できませんでした")}t.disabled=false;return}
  if(t.id==="saveMemo"){
    const goal=$("#my-goal").value, memo=$("#my-memo").value; t.disabled=true;
    try{ await db.doc("users/"+myId+"/private/notes").set({goal,memo,updatedAt:Date.now()},{merge:true}); draft=null; toast("目標とメモを保存しました"); }
    catch(e){ toast("保存できませんでした。もう一度試してください"); }
    t.disabled=false; return render();
  }
  if(d.self){
    if(!S.auth) return authSheet("login");
    const cur=(S.priv.understanding||{})[d.self]; const val=cur===d.v?firebase.firestore.FieldValue.delete():d.v;
    try{ await db.doc("users/"+myId+"/private/notes").set({understanding:{[d.self]:val}},{merge:true}); }
    catch(e){ toast("保存できませんでした"); }
    return;
  }
  if(d.themeSet){ls.set("theme",d.themeSet);applyTheme();t.parentElement.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b===t));return}
  if(d.act==="register") return S.auth?profileSheet(true):authSheet("signup");
  if(d.act==="profile") return profileSheet(false);
  if(d.act==="login") return authSheet("login");
  if(d.act==="signup") return authSheet("signup");
  if(d.act==="logout"){ closeSheet(); try{ await auth.signOut(); toast("ログアウトしました"); }catch(e){ toast("ログアウトできませんでした"); } return setTab("home"); }
  if(d.act==="copyweek"){const w=weekText(); if(w) copy(w); else toast("今週の予定はまだありません"); return}
});

function applyTheme(){const t=ls.get("theme");if(t==="dark"||t==="light")document.documentElement.dataset.theme=t;else delete document.documentElement.dataset.theme}

/* ---------- countdown tick ---------- */
setInterval(()=>{const c=$("#cd");if(!c)return;const now=Date.now();c.innerHTML=cdHtml(Number(c.dataset.start)-now,Number(c.dataset.end)-now)},20000);

/* ---------- confetti ---------- */
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const cv=$("#fx"),ctx=cv.getContext("2d"),W=cv.width=innerWidth*devicePixelRatio,H=cv.height=innerHeight*devicePixelRatio;
  const cols=["#C6F432","#22D3EE","#FF8A3D","#A78BFA","#F5C542"];
  const P=Array.from({length:120},()=>({x:W/2,y:H*.45,vx:(Math.random()-.5)*22*devicePixelRatio,vy:(-Math.random()*20-6)*devicePixelRatio,s:(Math.random()*6+4)*devicePixelRatio,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.random()*5|0]}));
  let f=0;(function loop(){ctx.clearRect(0,0,W,H);for(const p of P){p.vy+=.7*devicePixelRatio;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore()}if(++f<110)requestAnimationFrame(loop);else ctx.clearRect(0,0,W,H)})();
}

/* ---------- splash ---------- */
let splashDone=false;
function hideSplash(){
  if(splashDone) return; splashDone=true;
  const el=$("#splash"); if(!el) return;
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const wait=reduce?0:Math.max(0,1900-performance.now());
  setTimeout(()=>{ el.classList.add("out"); setTimeout(()=>el.remove(),600); },wait);
}
function maybeHideSplash(){ if(S.ready.e && S.authReady) hideSplash(); }
setTimeout(()=>{ const w=$("#spWait"); if(w&&!splashDone) w.classList.add("on"); },3500);
setTimeout(hideSplash,9000);

/* ---------- boot ---------- */
applyTheme();
calMode=ls.get("calMode")==="week"?"week":"month";
render();

function setStatus(html){$("#status").innerHTML=html}
(()=>{
  const cfg=window.FIREBASE_CONFIG;
  if(typeof firebase==="undefined"||!cfg||!cfg.apiKey||/ここに/.test(cfg.apiKey)){
    S.canWrite=false; hideSplash();
    setStatus(`<div class="banner warn">まだデータベースにつながっていません。firebase-config.js にFirebaseの設定を貼り付けてください(手順はREADMEにあります)。</div>`);
    render();return;
  }
  firebase.initializeApp(cfg);
  db=firebase.firestore(); auth=firebase.auth(); auth.languageCode="ja";
  const timer=setTimeout(()=>{ if(!S.ready.e) setStatus(`<div class="banner warn">データにまだ接続できていません。通信状況を確認してください。</div>`) },10000);
  const fail=e=>{ if(e&&e.code==="permission-denied"&&!auth.currentUser) return; clearTimeout(timer); hideSplash(); setStatus(`<div class="banner warn">データを読み込めませんでした(${esc(e&&e.code||"error")})。ページを再読み込みしてください。</div>`) };
  db.collection("events").onSnapshot(s=>{S.events=s.docs.map(d=>({id:d.id,...d.data()})); if(!s.metadata.fromCache){S.ready.e=1;clearTimeout(timer);setStatus("");maybeHideSplash()} render()},fail);
  db.doc("settings/app").onSnapshot(s=>{S.appName=s.exists?(s.data().name||""):""; if(S.appName) ls.set("appName",S.appName); else ls.del("appName"); render()},fail);
  auth.onAuthStateChanged(u=>{
    unsubs.forEach(f=>f()); unsubs=[];
    S.auth=u; myId=u?u.uid:null; S.canWrite=!!u; S.authReady=true;
    S.members={}; S.rsvps=[]; S.progress={}; S.priv={}; draft=null;
    if(u){
      unsubs.push(db.collection("members").onSnapshot(s=>{S.members={};s.docs.forEach(d=>S.members[d.id]=d.data());render()},fail));
      unsubs.push(db.collection("rsvps").onSnapshot(s=>{S.rsvps=s.docs.map(d=>({id:d.id,...d.data()}));render()},fail));
      unsubs.push(db.doc("grammar/progress").onSnapshot(s=>{const d=s.exists?s.data():{};S.progress=d.statuses||{};S.progressSample=!!d.sample;render()},fail));
      unsubs.push(db.doc("users/"+u.uid+"/private/notes").onSnapshot(s=>{S.priv=s.exists?s.data():{};render()},fail));
    }
    render(); maybeHideSplash();
  });
})();
})();
</script>
</body>
</html>
